# Semaine 2 : déploiement de l'API sur Azure App Service, SANS mot de passe (OIDC).
# Variables du dépôt (Settings > Secrets and variables > Actions > Variables) : WEBAPP_NAME
# Secrets : AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (affichés par scripts/bootstrap-oidc.sh)
name: deploy-appservice
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/deploy-appservice.yml']
  workflow_dispatch:
permissions:
  id-token: write   # nécessaire pour obtenir le jeton OIDC
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish src/Beacon.Api -c Release -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev   # le sujet OIDC devient repo:OWNER/REPO:environment:dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          package: ./publish
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "https://${{ vars.WEBAPP_NAME }}.azurewebsites.net/health"
